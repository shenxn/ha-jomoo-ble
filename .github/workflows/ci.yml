name: Offline validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_repository.py
      - run: python scripts/sync_library.py --check
      - run: python -m pip install ruff==0.15.4
      - run: ruff check .
      - run: ruff format --check .
      - run: git diff --check

  ha-zs821j:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run HA config flow and refresh against a simulated ZS821J
        run: |
          docker run --rm --network none --entrypoint python \
            -v "$PWD:/repo:ro" ghcr.io/home-assistant/home-assistant:2026.9.1 \
            /repo/tests/ha_smoke/smoke_in_ha_container.py /repo --zs821j
